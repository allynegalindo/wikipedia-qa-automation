name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ordem por prioridade: o lint e a API são rápidos e baratos. Se a API (a fonte
# da verdade) falhar, não faz sentido gastar minutos subindo navegador e emulador.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint PY=python

  api:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make api PY=python

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 14

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: make web PY=python

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-web
          path: allure-results/
          retention-days: 14

  mobile:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make apk PY=python

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instala o Appium e o driver Android
        run: |
          npm install -g appium@4.0.0
          appium driver install uiautomator2@9.2.1

      # Permite que o emulador use a virtualização (KVM) do runner
      - name: Habilita o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sobe o Appium
        run: |
          appium --log appium.log &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4723/status > /dev/null; do sleep 1; done'

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: make mobile PY=python

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-mobile
          path: allure-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: appium-log
          path: appium.log
          retention-days: 14

  # Junta os resultados das três camadas num relatório só do Allure
  relatorio:
    needs: [api, web, mobile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make relatorio PY=python

      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  # Publica o relatório no GitHub Pages, inclusive quando algum teste falha
  publicar-relatorio:
    needs: relatorio
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report/
      # Um nome por tentativa: ao refazer só este job (re-run), o envio anterior
      # continua na mesma execução, e dois envios com o mesmo nome travam a publicação.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
